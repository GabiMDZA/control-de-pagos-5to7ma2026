spring.application.name=ControlDePagos
server.port=8080
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/controldepagos?useSSL=false&serverTimezone=America/Argentina/Mendoza&allowPublicKeyRetrieval=true
#elegir en clase el puerto o conexión
spring.datasource.username=root
spring.datasource.password=root
#JPA
spring.jpa.generate-ddl=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
# Table names physically
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl